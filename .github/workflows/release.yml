name: Release Codex Studio

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Apple Silicon release
    runs-on: macos-26
    env:
      REPOSITORY: appleforever11/CodexStudio
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode.app; do
            if [[ -d "$candidate/Contents/Developer" ]]; then
              sudo xcode-select --switch "$candidate/Contents/Developer"
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              xcodebuild -version
              exit 0
            fi
          done
          echo "No Xcode 26 installation was found on the runner." >&2
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          exit 1

      - name: Validate tag and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "RELEASE_NOTES/${version}.md"

      - name: Validate distribution secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER APPLE_NOTARY_KEY_P8_BASE64 SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/codexstudio-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Resolve dependencies and run build checks
        run: |
          set -euo pipefail
          xcrun swift --version
          xcrun swift package resolve
          swift build --configuration debug
          swift build --configuration release

      - name: Build signed release archives
        shell: bash
        env:
          CODEX_STUDIO_BUILD_CONFIGURATION: release
          CODEX_STUDIO_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/codexstudio-stage"
          mkdir -p "$stage"
          CODEX_STUDIO_RELEASE_STAGE="$stage" \
          CODEX_STUDIO_VERSION="$version" \
            ./script/package_release.sh "$version" "$RUNNER_TEMP/CodexStudio-${version}-arm64.zip"
          echo "CODEX_STUDIO_RELEASE_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Notarize app and DMG
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          CODEX_STUDIO_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          zip="$RUNNER_TEMP/CodexStudio-${version}-arm64.zip"
          dmg="$RUNNER_TEMP/CodexStudio-${version}-arm64.dmg"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"

          notarize_and_require_acceptance() {
            local archive="$1"
            local result="$RUNNER_TEMP/notary-$(basename "$archive").json"
            xcrun notarytool submit "$archive" \
              --key "$key" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER" \
              --wait \
              --output-format json > "$result"
            local status
            status="$(plutil -extract status raw -o - "$result")"
            if [[ "$status" != "Accepted" ]]; then
              echo "Apple notarization rejected $archive with status: $status" >&2
              exit 1
            fi
          }

          notarize_and_require_acceptance "$zip"
          xcrun stapler staple "$CODEX_STUDIO_RELEASE_STAGE/CodexStudio.app"
          xcrun stapler validate "$CODEX_STUDIO_RELEASE_STAGE/CodexStudio.app"

          rm -f "$zip"
          ditto --norsrc --noextattr --noqtn -c -k --keepParent \
            "$CODEX_STUDIO_RELEASE_STAGE/CodexStudio.app" "$zip"

          CODEX_STUDIO_SKIP_BUILD=1 \
          CODEX_STUDIO_APP_BUNDLE="$CODEX_STUDIO_RELEASE_STAGE/CodexStudio.app" \
          CODEX_STUDIO_VERSION="$version" \
            ./script/package_dmg.sh "$dmg"

          notarize_and_require_acceptance "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Generate signed Sparkle appcast
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./script/generate_appcast.sh \
            "$version" \
            "$RUNNER_TEMP/CodexStudio-${version}-arm64.zip" \
            "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/CodexStudio-${version}-arm64.zip" \
            "$RUNNER_TEMP/CodexStudio-${version}-arm64.dmg" \
            "$RUNNER_TEMP/appcast.xml" \
            --repo "$REPOSITORY" \
            --title "Codex Studio ${version}" \
            --notes-file "RELEASE_NOTES/${version}.md"
